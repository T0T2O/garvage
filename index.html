<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ごみはどこへ　思い出しクイズ</title>
<style>
  :root{--blue:#1261a0;--deep:#0c4f87;--sky:#eaf6ff;--green:#e7f7ec;--yellow:#fff8d8;--pink:#fff0f0;--ink:#17324d;--line:#b9d5e8;--orange:#f1912c;}
  *{box-sizing:border-box} body{margin:0;background:#f4f8fb;color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
  header{background:linear-gradient(135deg,var(--deep),#1376b4);color:#fff;padding:28px 18px 24px}.wrap{max-width:860px;margin:0 auto}h1{margin:0;font-size:clamp(28px,5vw,45px);letter-spacing:.04em}.sub{margin:5px 0 0;font-size:17px;font-weight:700}
  main{padding:22px 16px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,4vw,32px);box-shadow:0 3px 14px rgba(28,78,111,.11)}
  .intro h2,.finish h2{margin:0 0 10px;color:var(--blue);font-size:27px}.intro p{margin:8px 0}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.step{background:var(--yellow);border:1px solid #ead57c;border-radius:999px;padding:5px 10px;font-weight:800}
  .start,.next,.check,.again{border:0;border-radius:11px;color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}.start{display:block;width:min(100%,420px);margin:21px auto 0;background:var(--orange);padding:14px 18px;font-size:20px}.start:hover,.next:hover,.check:hover,.again:hover{filter:brightness(.96);transform:translateY(-1px)}
  .hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.progress{font-weight:900;color:var(--blue);font-size:17px}.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.dot{width:10px;height:10px;border-radius:50%;background:#c9dbe7}.dot.done{background:#58ab78}.dot.now{background:var(--orange);transform:scale(1.35)}
  .round{display:inline-block;background:var(--sky);border:1px solid #a9cde7;border-radius:999px;padding:5px 10px;font-weight:900;color:var(--blue)}.round-note{margin:9px 0 18px;padding:9px 12px;background:#f7fbfe;border-left:5px solid var(--blue);border-radius:7px;font-weight:700}
  .qno{display:inline-grid;place-items:center;width:39px;height:39px;background:var(--blue);color:#fff;border-radius:50%;font-size:20px;font-weight:900}.kind{margin-left:8px;color:#637b8f;font-size:14px;font-weight:800}.question{font-size:clamp(22px,4vw,29px);line-height:1.45;font-weight:900;margin:16px 0 20px}.choices{display:grid;gap:11px}.choice{width:100%;text-align:left;padding:14px 15px;border:2px solid #bdd5e5;border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:18px;cursor:pointer}.choice:hover:not(:disabled){background:var(--sky);border-color:#62a6d6}.choice.selected{outline:3px solid #82c8ef;border-color:var(--blue)}.choice.correct{background:var(--green);border-color:#57aa79}.choice.wrong{background:var(--pink);border-color:#df7474}.choice:disabled{cursor:default}
  .button-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.check{background:var(--orange);padding:11px 17px;font-size:18px}.next{background:var(--blue);padding:11px 17px;font-size:18px}.feedback{display:none;margin-top:18px;padding:13px 15px;background:#f3faff;border-left:6px solid var(--blue);border-radius:8px;font-size:17px}.feedback.show{display:block}.feedback strong{color:var(--blue);font-size:19px}.say{display:block;margin-top:7px;padding:8px 10px;background:var(--yellow);border-radius:7px;color:#684a13;font-weight:800}.hint{margin-top:17px;background:var(--yellow);border-radius:8px;padding:11px 13px;font-weight:800}.writebox{width:100%;min-height:130px;margin-top:10px;padding:12px;border:2px solid #bdd5e5;border-radius:10px;font:inherit;font-size:18px;resize:vertical}.writebox:focus{outline:3px solid #82c8ef;border-color:var(--blue)}.finish{background:var(--green);border:1px solid #8ac7a2}.scorebig{font-size:42px;color:#15633a;font-weight:900;margin:8px 0}.reflection{margin-top:17px;padding:13px;background:#fff;border-radius:10px}.reflection label{font-weight:900;display:block}.reflection textarea{width:100%;min-height:62px;margin-top:6px;border:2px dashed #71b88d;border-radius:8px;padding:8px;font:inherit}.again{background:var(--blue);padding:11px 17px;font-size:17px;margin-top:18px}
  @media(max-width:560px){header{padding:21px 16px}.panel{padding:18px}.question{font-size:23px}.choice{font-size:16px;padding:12px}.topbar{align-items:flex-start;flex-direction:column}.dots{justify-content:flex-start}.button-row{justify-content:stretch}.button-row button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><h1>ごみはどこへ　思い出しクイズ</h1><p class="sub">一問ずつ、ぽちぽち進んで、ごみの道を思い出そう。</p></div></header>
<main class="wrap">
  <section id="intro" class="panel intro">
    <h2>ごみ<ruby>探偵<rt>たんてい</rt></ruby>クイズのやり方</h2>
    <p>答えを選んだら、すぐに答え合わせをしません。班の人に<strong>「なぜそう思ったか」</strong>を一言伝えてから、答えを確かめましょう。</p>
    <div class="steps"><span class="step">① 一人で考える</span><span class="step">② 答えを選ぶ</span><span class="step">③ 理由を一言言う</span><span class="step">④ 答えを確かめる</span><span class="step">⑤ つぎへ進む</span></div>
    <p>間違えても大丈夫。答えを覚えるより、<strong>「ごみはどこへ行き、なぜそうするのか」</strong>を言えるようにするクイズです。</p>
    <button class="start" onclick="startQuiz()">クイズをはじめる</button>
  </section>

  <section id="quiz" class="panel hidden" aria-live="polite">
    <div class="topbar"><div class="progress" id="progress"></div><div class="dots" id="dots"></div></div>
    <div id="round" class="round"></div><p id="roundNote" class="round-note"></p>
    <div><span id="qno" class="qno"></span><span id="kind" class="kind"></span></div>
    <p id="question" class="question"></p>
    <div id="choices" class="choices"></div>
    <div id="writeArea" class="hidden"></div>
    <div id="feedback" class="feedback"></div>
    <div class="button-row"><button id="check" class="check" onclick="checkAnswer()">答えを確かめる</button><button id="next" class="next hidden" onclick="nextQuestion()">つぎの問題へ</button></div>
  </section>

  <section id="finish" class="panel finish hidden">
    <h2>おわりのふり返り</h2><p>全部で29問のクイズでした。</p><div class="scorebig"><span id="finalScore">0</span> / 29 問</div><p>正解数よりも、理由を言えたことが大切です。次の二つを書いて、学んだことを自分の言葉にしよう。</p>
    <div class="reflection"><label for="canExplain">説明できるようになったこと</label><textarea id="canExplain" placeholder="例：燃やしたごみの灰は、最終処分場へ行くこと。"></textarea></div>
    <div class="reflection"><label for="wantKnow">まだ確かめたいこと</label><textarea id="wantKnow" placeholder="例：最終処分場を長く使うために、家で何ができるかな。"></textarea></div>
    <button class="again" onclick="restartQuiz()">もう一度、はじめからやる</button>
  </section>
</main>
<script>
const rounds={
  1:{name:'ラウンド1　ごみ発見クイズ',note:'学校や家庭の場面を思い出します。場所でしていることから、どんなごみが出るかを考えよう。'},
  2:{name:'ラウンド2　清掃工場たんけん',note:'「どこで、何をする？」を結び付けます。名前だけでなく、働きまで言えたら大成功。'},
  3:{name:'ラウンド3　ごみの道をつなぐ',note:'ごみの種類で行き先が変わります。矢印を頭の中でたどりながら答えよう。'},
  4:{name:'ラウンド4　資料・昔と今クイズ',note:'資料は「題名・年・単位」を最初に確かめます。見たことと、自分の考えを分けよう。'},
  5:{name:'ラウンド5　3R・みんなの取組クイズ',note:'「買う前・使う時・使った後」のどこでできるかを考えよう。'}
};
const questions=[
  {r:1,k:'3たく',q:'教室で出やすいごみは、どれ？',c:['ア　野菜の皮','イ　紙くずや消しゴムのかす','ウ　大きな家具'],a:1,e:'教室では、学習に使った紙や消しゴムのかすが出やすいです。',s:'「勉強で紙を使うから、紙くずが出る。」'},
  {r:1,k:'3たく',q:'給食室で出やすいごみは、どれ？',c:['ア　生ごみ','イ　自転車','ウ　古い机'],a:0,e:'給食をつくると、野菜の皮などの生ごみが出ます。',s:'「食べ物をあつかうから、生ごみが出る。」'},
  {r:1,k:'理由を考える',q:'ごみを種類ごとに分けて出す、一番大きな理由は？',c:['ア　ごみ袋を重くするため','イ　ごみを見えにくくするため','ウ　種類によって、処理や資源にする方法が違うため'],a:2,e:'燃やすごみ、資源物、粗大ごみなどは、その後の行き先や処理のしかたが違います。',s:'「分別すると、その後の処理がしやすい。」'},
  {r:1,k:'○か×か',q:'ごみ収集車は、いつでも、どのごみでも同じように集めている。○か×か。',c:['ア　○','イ　×'],a:1,e:'地域では、決められた曜日・場所・出し方に合わせて、種類ごとに集めています。',s:'「決まりを守ると、収集する人が集めやすい。」'},
  {r:1,k:'順番',q:'ごみが家から出た後、最初に近いのはどれ？',c:['ア　集積所','イ　最終処分場','ウ　再生工場'],a:0,e:'家庭で分けて出したごみは、集積所に集められ、収集車で運ばれます。',s:'「家庭→集積所→収集車。」'},
  {r:2,k:'3たく',q:'ごみピットは、何をする場所？',c:['ア　ごみを埋め立てる','イ　運ばれたごみを一時的にためる','ウ　新しい製品を売る'],a:1,e:'収集車から運ばれたごみを、工場の中で一時的にためる場所です.'},
  {r:2,k:'3たく',q:'クレーンの仕事は、どれ？',c:['ア　ごみを水で洗う','イ　ガスを外へ出す','ウ　ごみをつかんで動かし、焼却炉へ入れる'],a:2,e:'クレーンは、ピットのごみをつかんで動かし、焼却炉へ送ります.'},
  {r:2,k:'3たく',q:'焼却炉（しょうきゃくろ）では、何をする？',c:['ア　ごみを高い温度で燃やす','イ　びんを色ごとに分ける','ウ　ごみを集積所に置く'],a:0,e:'焼却炉で燃やすことで、ごみの量を減らします.'},
  {r:2,k:'○か×か',q:'中央制御室（ちゅうおうせいぎょしつ）では、機械の動きや温度などを見守っている。○か×か。',c:['ア　○','イ　×'],a:0,e:'中央制御室では、工場を安全に動かすため、機械のようすや温度などを見守ります.'},
  {r:2,k:'言葉を選ぶ',q:'ガスを煙突から出す前に、取りのぞくものは？',c:['ア　あまいにおい','イ　水だけ','ウ　有害（ゆうがい）な物質'],a:2,e:'周りの環境や人の安全を守るため、有害な物質を取りのぞきます.'},
  {r:2,k:'言葉を選ぶ',q:'ごみを燃やしたときの蒸気（じょうき）の力で、何をつくる？',c:['ア　電気','イ　石','ウ　土'],a:0,e:'燃やした熱でできた蒸気を利用して、電気をつくる工夫があります.'},
  {r:2,k:'行き先',q:'ごみを燃やして残った灰（はい）は、どこへ運ばれる？',c:['ア　学校の教室','イ　最終処分場（さいしゅうしょぶんじょう）','ウ　集積所'],a:1,e:'燃やして終わりではありません。残った灰は最終処分場で埋め立てます。',s:'「灰が残るから、最終処分場が必要。」'},
  {r:3,k:'行き先',q:'燃やさないごみを、処理する施設はどれ？',c:['ア　不燃（ふねん）ごみ処理センター','イ　清掃工場の焼却炉','ウ　学校の給食室'],a:0,e:'燃やさないごみは、不燃ごみ処理センターで処理します.'},
  {r:3,k:'行き先',q:'大きな家具などの粗大ごみを、細かくする施設はどれ？',c:['ア　最終処分場','イ　リサイクルセンター','ウ　粗大ごみはさい処理施設'],a:2,e:'粗大ごみは、はさいして小さくし、材料ごとに分けやすくします.'},
  {r:3,k:'行き先',q:'びん・かん・ペットボトルなどの資源物を集め、分ける施設はどれ？',c:['ア　最終処分場','イ　リサイクルセンター','ウ　ごみピット'],a:1,e:'資源物はリサイクルセンターで集めたり分けたりして、次の工程へ送られます.'},
  {r:3,k:'行き先',q:'資源物を新しい製品の原料にして、物をつくる工場はどれ？',c:['ア　再生工場','イ　集積所','ウ　中央制御室'],a:0,e:'再生工場では、資源物を原料にして新しい製品をつくります.'},
  {r:3,k:'順番',q:'家庭から出た燃やすごみの流れとして正しいのはどれ？',c:['ア　家庭→最終処分場→収集車→清掃工場','イ　家庭→集積所→収集車→清掃工場→最終処分場','ウ　家庭→再生工場→集積所→清掃工場'],a:1,e:'燃やすごみは収集車で清掃工場へ運ばれ、残った灰は最終処分場へ運ばれます.'},
  {r:3,k:'理由を考える',q:'最終処分場をできるだけ長く使うために、大切なのはどれ？',c:['ア　ごみを何でも一緒に出す','イ　使える物もすぐに捨てる','ウ　ごみを減らし、正しく分別する'],a:2,e:'埋め立てる量を減らせば、最終処分場をより長く使うことにつながります.'},
  {r:4,k:'資料の読み方',q:'棒グラフを読む最初の確認として、いちばんよいのはどれ？',c:['ア　棒の色だけを見る','イ　自分の予想を先に決める','ウ　題名・年・単位を確かめる'],a:2,e:'何の量を、いつと比べ、どの単位で表しているかを先に確かめます.'},
  {r:4,k:'数を読む',q:'教科書の資料では、2003年から2018年までに、もやすごみは約何万トン減った？',c:['ア　約5万トン','イ　約45万トン','ウ　約450万トン'],a:1,e:'年と数値を確かめて、大きい方から小さい方を引くと、約45万トン減っています.'},
  {r:4,k:'円グラフ',q:'家庭から出されたもやすごみの中で、いちばん多いものは？',c:['ア　生ごみ','イ　金属類','ウ　ペットボトルだけ'],a:0,e:'円グラフでは、生ごみの割合が最も大きく示されています.'},
  {r:4,k:'資料をつなぐ',q:'ペットボトルがリサイクルされた後の物として、資料にあるのはどれ？',c:['ア　石油','イ　生ごみ','ウ　プラスチック製品'],a:2,e:'ペットボトルは原料になり、プラスチック製品などに生まれ変わります.'},
  {r:4,k:'昔と今',q:'ごみ処理のしかたのうつり変わりとして正しいのはどれ？',c:['ア　昔ほど、分別やリサイクルが進んでいた','イ　集めて燃やすだけでなく、分別して資源にする工夫が進んだ','ウ　今は、ごみを全く処理しない'],a:1,e:'集めて燃やすだけでなく、分別して資源にする工夫が進みました.'},
  {r:4,k:'理由を考える',q:'ごみ処理のしかたが変わってきた理由として正しいのはどれ？',c:['ア　ごみの量が増え、生活の様子が変わったから','イ　ごみが自然になくなるようになったから','ウ　処理をする人がいなくなったから'],a:0,e:'ごみの量の増加や生活の変化に合わせて、処理のしかたも工夫されてきました.'},
  {r:5,k:'目的',q:'ごみを資源としてリサイクルする目的はどれ？',c:['ア　ごみを増やすため','イ　限りある資源を大切に使い、ごみを減らすため','ウ　分別を難しくするため'],a:1,e:'資源をくり返し使い、ごみの量を減らすことにつながります.'},
  {r:5,k:'3R',q:'マイバッグを使って、レジ袋をもらう回数を減らすのはどれ？',c:['ア　リデュース','イ　リユース','ウ　リサイクル'],a:0,e:'リデュースは、ごみを出さない・減らすことです.'},
  {r:5,k:'3R',q:'まだ着られる服を、弟や妹にゆずって使うのはどれ？',c:['ア　リデュース','イ　リユース','ウ　リサイクル'],a:1,e:'リユースは、物を形のままくり返し使うことです.'},
  {r:5,k:'3R',q:'ペットボトルを正しく分けて出し、原料として新しい物にするのはどれ？',c:['ア　リデュース','イ　リユース','ウ　リサイクル'],a:2,e:'リサイクルは、使い終わった物を原料として新しい物にします.'},
  {r:5,k:'みんなの協力',q:'店頭回収の箱を置いたり、マイバッグを呼びかけたりするのは、だれの取組？',c:['ア　店','イ　収集車だけ','ウ　焼却炉だけ'],a:0,e:'店、地域の人、行政、家庭などが、それぞれ協力してごみを減らしています.'}
];
let current=0, selected=null, answered=false, score=0;
function startQuiz(){document.getElementById('intro').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');current=0;score=0;render();}
function makeDots(){const box=document.getElementById('dots');box.innerHTML='';for(let i=0;i<questions.length;i++){const d=document.createElement('span');d.className='dot'+(i<current?' done':i===current?' now':'');box.appendChild(d);}}
function render(){const q=questions[current];selected=null;answered=false;document.getElementById('progress').textContent='問題 '+(current+1)+' / 30　　できた：'+score+' / 29';makeDots();document.getElementById('round').textContent=rounds[q.r].name;document.getElementById('roundNote').textContent=rounds[q.r].note;document.getElementById('qno').textContent=current+1;document.getElementById('kind').textContent=q.k;document.getElementById('question').textContent=q.q;const cs=document.getElementById('choices');cs.innerHTML='';q.c.forEach((text,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>selectChoice(i);cs.appendChild(b);});document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('check').classList.remove('hidden');document.getElementById('next').classList.add('hidden');const nextButton=document.getElementById('next');nextButton.textContent=(current===questions.length-1)?'自分の作戦へ':'つぎの問題へ';nextButton.onclick=nextQuestion;window.scrollTo({top:0,behavior:'smooth'});}
function selectChoice(i){if(answered)return;selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',j===i));}
function checkAnswer(){if(selected===null){alert('まず答えを一つ選びましょう。');return;}const q=questions[current];answered=true;const buttons=document.querySelectorAll('.choice');buttons.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===selected&&i!==q.a)b.classList.add('wrong');});if(selected===q.a)score++;const fb=document.getElementById('feedback');fb.innerHTML='<strong>答え：'+q.c[q.a].slice(0,1)+'</strong><br>'+q.e+(q.s?'<span class="say">言ってみよう：'+q.s+'</span>':'');fb.classList.add('show');document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('progress').textContent='問題 '+(current+1)+' / 30　　できた：'+score+' / 29';}
function nextQuestion(){current++;if(current>=questions.length){showWrite();}else{render();}}
function showWrite(){document.getElementById('round').textContent='ラスト　自分の作戦';document.getElementById('roundNote').textContent='自分にできることを、3Rの言葉と理由を使って書こう。';document.getElementById('progress').textContent='問題 30 / 30　　できた：'+score+' / 29';document.getElementById('qno').textContent='30';document.getElementById('kind').textContent='自分の作戦';document.getElementById('question').textContent='明日から自分が続けることを一つ書こう。どの3Rか、なぜごみが減るかも書こう。';document.getElementById('choices').innerHTML='';const area=document.getElementById('writeArea');area.innerHTML='<div class="hint">書き方のヒント：「〜をする。これはリデュース／リユース／リサイクルで、〜だからごみが減る。」</div><textarea id="planText" class="writebox" placeholder="例：水とうを使う。これはリデュースで、ペットボトルなどの使い捨てのごみが減るから。"></textarea>';area.classList.remove('hidden');document.getElementById('feedback').className='feedback';document.getElementById('check').classList.add('hidden');const next=document.getElementById('next');next.textContent='ふり返りへ進む';next.classList.remove('hidden');next.onclick=showFinish;window.scrollTo({top:0,behavior:'smooth'});}
function showFinish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('finalScore').textContent=score;window.scrollTo({top:0,behavior:'smooth'});}
function restartQuiz(){document.getElementById('canExplain').value='';document.getElementById('wantKnow').value='';document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('intro').classList.remove('hidden');score=0;window.scrollTo({top:0,behavior:'smooth'});}
</script>
